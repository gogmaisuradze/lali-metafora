<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="translate(50, 50)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="#016166" stroke-width="2" />
    
    <!-- Outer Plum Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#7a3963" stroke-width="4" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#016166" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Central Gold Core -->
    <circle cx="0" cy="0" r="5" fill="#ffba00" />
    
    <!-- Inner Teal Stems -->
    <g stroke="#016166" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-22" />
      <line x1="0" y1="0" x2="15.5" y2="-15.5" />
      <line x1="0" y1="0" x2="22" y2="0" />
      <line x1="0" y1="0" x2="15.5" y2="15.5" />
      <line x1="0" y1="0" x2="0" y2="22" />
      <line x1="0" y1="0" x2="-15.5" y2="15.5" />
      <line x1="0" y1="0" x2="-22" y2="0" />
      <line x1="0" y1="0" x2="-15.5" y2="-15.5" />
    </g>
    
    <!-- Inner Plum Dots -->
    <g fill="#7a3963">
      <circle cx="0" cy="-22" r="2.5" />
      <circle cx="15.5" cy="-15.5" r="2.5" />
      <circle cx="22" cy="0" r="2.5" />
      <circle cx="15.5" cy="15.5" r="2.5" />
      <circle cx="0" cy="22" r="2.5" />
      <circle cx="-15.5" cy="15.5" r="2.5" />
      <circle cx="-22" cy="0" r="2.5" />
      <circle cx="-15.5" cy="-15.5" r="2.5" />
    </g>

    <!-- Outer Stems -->
    <g stroke="#7a3963" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="0" x2="12.2" y2="-29.5" />
      <line x1="0" y1="0" x2="29.5" y2="-12.2" />
      <line x1="0" y1="0" x2="29.5" y2="12.2" />
      <line x1="0" y1="0" x2="12.2" y2="29.5" />
      <line x1="0" y1="0" x2="-12.2" y2="29.5" />
      <line x1="0" y1="0" x2="-29.5" y2="12.2" />
      <line x1="0" y1="0" x2="-29.5" y2="-12.2" />
      <line x1="0" y1="0" x2="-12.2" y2="-29.5" />
    </g>

    <!-- Outer Gold Dots -->
    <g fill="#ffba00">
      <circle cx="12.2" cy="-29.5" r="2" />
      <circle cx="29.5" cy="-12.2" r="2" />
      <circle cx="29.5" cy="12.2" r="2" />
      <circle cx="12.2" cy="29.5" r="2" />
      <circle cx="-12.2" cy="29.5" r="2" />
      <circle cx="-29.5" cy="12.2" r="2" />
      <circle cx="-29.5" cy="-12.2" r="2" />
      <circle cx="-12.2" cy="-29.5" r="2" />
    </g>
  </g>
</svg>
