<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=index.html#booking">
    <title>დაჯავშნა — მეტაფორა</title>
    <script>
        var s = (window.location.search || '').replace(/^\?/, '');
        var h = (window.location.hash || '').replace(/^#/, '');
        var target = 'index.html#booking';
        var combinedParams = [];
        if (s) combinedParams.push(s);
        if (h && h.indexOf('?') !== -1) {
            combinedParams.push(h.substring(h.indexOf('?') + 1));
        } else if (h && h !== 'booking' && h.indexOf('=') !== -1) {
            combinedParams.push(h);
        }
        if (combinedParams.length > 0) {
            target += '?' + combinedParams.join('&');
        }
        window.location.replace(target);
    </script>
</head>
<body>
</body>
</html>
